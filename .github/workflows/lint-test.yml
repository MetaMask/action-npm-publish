name: Lint, test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
          cache-node-modules: ${{ matrix.node-version == '22.x' }}

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - name: Lint
        run: yarn lint
      - name: Validate RC changelog
        if: ${{ startsWith(github.head_ref, 'release/') }}
        run: yarn lint:changelog --rc
      - name: Validate changelog
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: yarn lint:changelog
      - name: Run shellcheck
        uses: fearphage/shellcheck-action@95d2a3d34d381a7314c286ea1725ca8cce3b51fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: yarn test
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test-publish-monorepo:
    name: Test publish monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Snaps repository
        uses: actions/checkout@v6
        with:
          repository: MetaMask/snaps
          ref: cecffa1a851a1fa5d68384c6f46ca1cf739f6d0c
          path: snaps
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup, build, publish
        env:
          PUBLISH_NPM_TAG: latest
          DRY_RUN: 'true'
        run: |
          cd snaps
          corepack enable
          yarn install --immutable
          # Bump a few workspaces to an unpublished version so the
          # publish/pack path is actually exercised.
          for pkg in snaps-sdk snaps-utils snaps-controllers; do
            jq '.version = "999.0.0"' "packages/$pkg/package.json" \
              > "packages/$pkg/package.json.tmp"
            mv "packages/$pkg/package.json.tmp" "packages/$pkg/package.json"
          done
          ../action-npm-publish/scripts/main.sh

  test-publish-monorepo-skip:
    name: Test skipping publish of latest version (monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Get latest version from NPM
        id: latest-release
        run: echo "release-version=$(npm view MetaMask/snaps version --workspaces=false)" >> "$GITHUB_OUTPUT"
      - name: Checkout Snaps repository
        uses: actions/checkout@v6
        with:
          repository: MetaMask/snaps
          ref: v${{ steps.latest-release.outputs.release-version }}
          path: snaps
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup, build, publish
        env:
          PUBLISH_NPM_TAG: latest
          DRY_RUN: 'false'
          ACTIONS_ID_TOKEN_REQUEST_URL: test
        run: |
          cd snaps
          corepack enable
          yarn install --immutable
          ../action-npm-publish/scripts/main.sh

  test-publish-polyrepo:
    name: Test publish polyrepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout utils repository
        uses: actions/checkout@v6
        with:
          repository: MetaMask/utils
          ref: 48e4a5a9d4d389c0e0b0a066f3ec4bb90b14e07b
          path: utils
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup, build, publish
        shell: bash
        env:
          PUBLISH_NPM_TAG: latest
          DRY_RUN: 'true'
        run: |
          cd utils
          corepack enable
          yarn install --immutable
          yarn build
          ../action-npm-publish/scripts/main.sh

  test-sanitize:
    name: Test sanitising Yarn configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create project with canaries
        run: |
          mkdir -p /tmp/canary

          cat > package.json <<'EOF'
          {
            "name": "sanitise-test",
            "private": true,
            "version": "0.0.0",
            "workspaces": ["packages/*"],
            "packageManager": "yarn@4.16.0+sha256.ba05224324578801b9cc98170d64aa50b9a36733b440fb0942306da3fbbdc7d1"
          }
          EOF

          mkdir -p .yarn/plugins packages/canary
          cat > .yarn/plugins/canary.cjs <<'EOF'
          module.exports = {
            name: 'canary',
            factory: () => {
              require('fs').writeFileSync('/tmp/canary/plugin', 'ran');
              return {};
            },
          };
          EOF

          cat > .yarnrc.yml <<'EOF'
          nodeLinker: node-modules
          plugins:
            - path: .yarn/plugins/canary.cjs
          EOF

          cat > packages/canary/package.json <<'EOF'
          {
            "name": "sanitise-test-canary",
            "version": "999.0.0",
            "publishConfig": { "registry": "https://registry.npmjs.org/" },
            "scripts": {
              "prepublish": "touch /tmp/canary/prepublish",
              "prepack": "touch /tmp/canary/prepack",
              "postpack": "touch /tmp/canary/postpack"
            }
          }
          EOF
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --no-immutable

          # The plugin must have loaded during the install, otherwise the
          # canary doesn't prove anything.
          test -e /tmp/canary/plugin
          rm /tmp/canary/plugin

          mkdir -p .yarn/releases
          echo "require('fs').writeFileSync('/tmp/canary/yarnpath', 'ran'); process.exit(1);" > .yarn/releases/canary.cjs
          echo "yarnPath: .yarn/releases/canary.cjs" >> .yarnrc.yml
      - name: Dry run publish
        uses: ./action-npm-publish
        # `YARN_*` variables override the action's Yarn configuration. With
        # `pnp`, Yarn doesn't find the `node-modules` install and the publish
        # fails, unless the action unsets the variable.
        env:
          YARN_NODE_LINKER: pnp
        with:
          dry-run: true
      - name: Check that no canaries ran
        run: |
          failed=0
          for marker in plugin yarnpath prepublish prepack postpack; do
            if [[ -e "/tmp/canary/$marker" ]]; then
              echo "::error::Canary '$marker' ran during publish."
              failed=1
            fi
          done
          exit "$failed"
      - name: Check that the package was packed without lifecycle scripts
        run: |
          tarball=/tmp/sanitise-test-canary-999.0.0.tgz
          test -f "$tarball"
          tar -O -zxf "$tarball" package/package.json \
            | jq --exit-status '.scripts | (has("prepublish") or has("prepack") or has("postpack")) | not'

  test-pack-select:
    name: Test pack action package selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create base commit
        run: |
          corepack enable

          git init --quiet
          git config user.name test
          git config user.email test@example.com

          cat > package.json <<'EOF'
          {
            "name": "select-test",
            "private": true,
            "version": "0.0.0",
            "workspaces": ["packages/*"],
            "packageManager": "yarn@4.16.0+sha256.ba05224324578801b9cc98170d64aa50b9a36733b440fb0942306da3fbbdc7d1"
          }
          EOF
          echo "nodeLinker: node-modules" > .yarnrc.yml
          echo "node_modules" > .gitignore

          for name in a b c; do
            mkdir -p "packages/$name"
            version="1.0.0"
            if [[ "$name" == "c" ]]; then
              version="0.0.0"
            fi
            echo "{ \"name\": \"@select-test/$name\", \"version\": \"$version\" }" > "packages/$name/package.json"
          done

          yarn install --no-immutable

          git add .gitignore .yarnrc.yml package.json yarn.lock packages
          git commit --quiet --message "Base"
      - name: Create release commit
        id: release-commit
        run: |
          # `a` is bumped, `d` is new, `b` changes without a version bump, `c`
          # stays at `0.0.0`, and `e` is new at `0.0.0`.
          echo '{ "name": "@select-test/a", "version": "1.1.0" }' > packages/a/package.json
          echo '{ "name": "@select-test/b", "version": "1.0.0", "description": "Changed" }' > packages/b/package.json

          mkdir -p packages/d packages/e
          echo '{ "name": "@select-test/d", "version": "1.0.0" }' > packages/d/package.json
          echo '{ "name": "@select-test/e", "version": "0.0.0" }' > packages/e/package.json

          git add packages
          git commit --quiet --message "Release"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pack the selected packages
        id: release
        uses: ./action-npm-publish/pack
        with:
          base: HEAD^
          artifact-name: ''
      - name: Check the release
        env:
          HAS_PACKAGES: ${{ steps.release.outputs.has-packages }}
          LOCATIONS: ${{ steps.release.outputs.locations }}
          DIRECTORY: ${{ runner.temp }}/tarballs
        run: |
          failed=0

          if [[ "$HAS_PACKAGES" != "true" ]]; then
            echo "::error::Expected packages, got has-packages=${HAS_PACKAGES}."
            failed=1
          fi

          if [[ "$LOCATIONS" != $'packages/a\npackages/d' ]]; then
            echo "::error::Unexpected locations: ${LOCATIONS}"
            failed=1
          fi

          mapfile -t tarballs < <(ls "$DIRECTORY")
          if [[ "${tarballs[*]}" != "@select-test-a-1.1.0.tgz @select-test-d-1.0.0.tgz" ]]; then
            echo "::error::Unexpected tarballs: ${tarballs[*]}"
            failed=1
          fi

          exit "$failed"
      - name: Create commit without version changes
        run: |
          echo '{ "name": "@select-test/b", "version": "1.0.0", "description": "Changed again" }' > packages/b/package.json
          git add packages
          git commit --quiet --message "Change without release"
      - name: Pack with nothing to release
        id: no-release
        uses: ./action-npm-publish/pack
        with:
          base: HEAD^
          artifact-name: ''
          output-directory: ${{ runner.temp }}/none
      - name: Check that nothing was packed
        env:
          HAS_PACKAGES: ${{ steps.no-release.outputs.has-packages }}
          LOCATIONS: ${{ steps.no-release.outputs.locations }}
        run: |
          if [[ "$HAS_PACKAGES" != "false" || -n "$LOCATIONS" || -e "$RUNNER_TEMP/none" ]]; then
            echo "::error::Expected nothing to be packed (has-packages=${HAS_PACKAGES}, locations=${LOCATIONS})."
            exit 1
          fi
      - name: Create two commits, of which only the first bumps a version
        run: |
          echo '{ "name": "@select-test/b", "version": "1.1.0" }' > packages/b/package.json
          git add packages
          git commit --quiet --message "Release b"

          echo '{ "name": "@select-test/a", "version": "1.1.0", "description": "Changed" }' > packages/a/package.json
          git add packages
          git commit --quiet --message "Change a without release"
      - name: Pack from the parent commit
        id: parent
        uses: ./action-npm-publish/pack
        with:
          base: HEAD^
          artifact-name: ''
          output-directory: ${{ runner.temp }}/parent
      - name: Pack from an explicit base
        id: explicit-base
        uses: ./action-npm-publish/pack
        with:
          base: ${{ steps.release-commit.outputs.sha }}
          artifact-name: ''
          output-directory: ${{ runner.temp }}/explicit-base
      - name: Pack with an all-zeros base
        id: zeros
        uses: ./action-npm-publish/pack
        with:
          base: '0000000000000000000000000000000000000000'
          artifact-name: ''
          output-directory: ${{ runner.temp }}/zeros
      - name: Check the bases
        env:
          PARENT: ${{ steps.parent.outputs.has-packages }}
          EXPLICIT_BASE: ${{ steps.explicit-base.outputs.has-packages }}
          EXPLICIT_BASE_LOCATIONS: ${{ steps.explicit-base.outputs.locations }}
          ZEROS: ${{ steps.zeros.outputs.has-packages }}
        run: |
          failed=0

          # `HEAD^` only sees the last commit, which doesn't bump a version.
          if [[ "$PARENT" != "false" ]]; then
            echo "::error::Expected no packages from the parent commit, got has-packages=${PARENT}."
            failed=1
          fi

          # An all-zeros base falls back to `HEAD^`.
          if [[ "$ZEROS" != "false" ]]; then
            echo "::error::Expected no packages from an all-zeros base, got has-packages=${ZEROS}."
            failed=1
          fi

          # The release commit as base sees the bump of `b` in the commit before
          # the last one.
          if [[ "$EXPLICIT_BASE" != "true" || "$EXPLICIT_BASE_LOCATIONS" != "packages/b" ]]; then
            echo "::error::Expected packages/b from the explicit base, got ${EXPLICIT_BASE_LOCATIONS}."
            failed=1
          fi

          exit "$failed"

  test-pack:
    name: Test pack action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create project
        run: |
          mkdir -p /tmp/canary

          cat > package.json <<'EOF'
          {
            "name": "pack-test",
            "private": true,
            "version": "0.0.0",
            "workspaces": ["packages/*"],
            "packageManager": "yarn@4.16.0+sha256.ba05224324578801b9cc98170d64aa50b9a36733b440fb0942306da3fbbdc7d1"
          }
          EOF

          echo "nodeLinker: node-modules" > .yarnrc.yml

          for name in first second; do
            mkdir -p "packages/$name"
            cat > "packages/$name/package.json" <<EOF
          {
            "name": "@pack-test/$name",
            "version": "1.2.3",
            "publishConfig": { "access": "public", "registry": "https://registry.npmjs.org/" },
            "scripts": {
              "prepack": "touch /tmp/canary/$name-prepack",
              "postpack": "touch /tmp/canary/$name-postpack",
              "test": "echo test"
            }
          }
          EOF
          done

          mkdir -p packages/private
          echo '{ "name": "@pack-test/private", "private": true, "version": "1.0.0" }' > packages/private/package.json
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --no-immutable
      - name: Pack all packages
        id: pack-all
        uses: ./action-npm-publish/pack
        with:
          artifact-name: pack-test-all
          locations: |
            packages/first
            packages/second
      - name: Pack a selected package
        id: pack-selected
        uses: ./action-npm-publish/pack
        with:
          output-directory: ${{ runner.temp }}/selected
          locations: packages/second
          artifact-name: ''
      - name: Create an output directory that is not empty
        run: |
          mkdir -p "$RUNNER_TEMP/occupied"
          touch "$RUNNER_TEMP/occupied/planted.tgz"
      - name: Pack to a directory that is not empty
        id: pack-occupied
        uses: ./action-npm-publish/pack
        continue-on-error: true
        with:
          output-directory: ${{ runner.temp }}/occupied
          locations: packages/second
          artifact-name: ''
      - name: Check the tarballs
        env:
          ALL_DIRECTORY: ${{ runner.temp }}/tarballs
          SELECTED_DIRECTORY: ${{ runner.temp }}/selected
          OCCUPIED_OUTCOME: ${{ steps.pack-occupied.outcome }}
        run: |
          failed=0

          # The planted tarball must make the action fail, and must not be
          # joined by a real tarball.
          mapfile -t occupied < <(ls "$RUNNER_TEMP/occupied")
          if [[ "$OCCUPIED_OUTCOME" != "failure" || "${occupied[*]}" != "planted.tgz" ]]; then
            echo "::error::Expected packing to a directory that is not empty to fail (outcome=${OCCUPIED_OUTCOME}, files=${occupied[*]})."
            failed=1
          fi

          mapfile -t all < <(ls "$ALL_DIRECTORY")
          if [[ "${all[*]}" != "@pack-test-first-1.2.3.tgz @pack-test-second-1.2.3.tgz" ]]; then
            echo "::error::Unexpected tarballs: ${all[*]}."
            failed=1
          fi

          mapfile -t selected < <(ls "$SELECTED_DIRECTORY")
          if [[ "${selected[*]}" != "@pack-test-second-1.2.3.tgz" ]]; then
            echo "::error::Unexpected selected tarballs: ${selected[*]}."
            failed=1
          fi

          # Removing the scripts is tested by the sanitise test. This checks that
          # the action sanitises before it packs.
          if compgen -G "/tmp/canary/*" > /dev/null; then
            echo "::error::Lifecycle scripts ran while packing."
            failed=1
          fi

          exit "$failed"

  test-pack-artifact:
    name: Test pack action artifact
    needs: test-pack
    runs-on: ubuntu-latest
    steps:
      - name: Download the uploaded tarballs
        uses: actions/download-artifact@v8
        with:
          name: pack-test-all
          path: ${{ runner.temp }}/downloaded
      - name: Check the tarballs
        env:
          DOWNLOADED_DIRECTORY: ${{ runner.temp }}/downloaded
        run: |
          mapfile -t downloaded < <(ls "$DOWNLOADED_DIRECTORY")
          if [[ "${downloaded[*]}" != "@pack-test-first-1.2.3.tgz @pack-test-second-1.2.3.tgz" ]]; then
            echo "::error::Unexpected downloaded tarballs: ${downloaded[*]}"
            exit 1
          fi

  # There is no checkout of a project in this job, as in a job that publishes
  # the tarballs. The action is only checked out to use it.
  test-use-pack:
    name: Test publishing packed tarballs
    needs: test-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Dry run publish
        uses: ./action-npm-publish
        with:
          use-pack: true
          artifact-name: pack-test-all
          dry-run: true
      - name: Check that the tarballs were downloaded
        run: |
          mapfile -t tarballs < <(ls "$RUNNER_TEMP/npm-tarballs"/*.tgz)
          if [[ ${#tarballs[@]} -ne 2 ]]; then
            echo "::error::Expected two tarballs, got ${#tarballs[@]}."
            exit 1
          fi

  test-use-pack-invalid-create:
    name: Create invalid tarball (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        case: [registry, publish-config, outside-path]
    steps:
      - name: Create the tarball
        env:
          CASE: ${{ matrix.case }}
        run: |
          mkdir -p tarballs build/package

          manifest='{ "name": "@invalid-test/package", "version": "1.0.0" }'
          paths=(package)

          case "$CASE" in
            registry)
              manifest='{ "name": "@invalid-test/package", "version": "1.0.0", "publishConfig": { "registry": "https://registry.example.com/" } }'
              ;;
            publish-config)
              manifest='{ "name": "@invalid-test/package", "version": "1.0.0", "publishConfig": { "access": "public", "@invalid-test:registry": "https://registry.example.com/" } }'
              ;;
            outside-path)
              echo "outside" > build/outside.txt
              paths=(package outside.txt)
              ;;
          esac

          echo "$manifest" > build/package/package.json
          tar -czf tarballs/invalid.tgz -C build "${paths[@]}"
      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: invalid-${{ matrix.case }}
          path: tarballs/invalid.tgz

  test-use-pack-invalid:
    name: Test rejecting an invalid tarball (${{ matrix.case }})
    needs: test-use-pack-invalid-create
    runs-on: ubuntu-latest
    strategy:
      matrix:
        case: [registry, publish-config, outside-path]
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v6
        with:
          path: action-npm-publish
      - name: Dry run publish
        id: publish
        uses: ./action-npm-publish
        continue-on-error: true
        with:
          use-pack: true
          artifact-name: invalid-${{ matrix.case }}
          dry-run: true
      - name: Check that the tarball was rejected
        if: steps.publish.outcome != 'failure'
        run: |
          echo "::error::Expected the action to reject the invalid tarball."
          exit 1
