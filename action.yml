name: 'Publish to npm'
description: 'Publish the release to npm'
inputs:
  npm-tag:
    description: 'The npm tag to publish to. Defaults to "latest".'
    required: false
    default: 'latest'
  provenance:
    description: 'Whether to include provenance information in the package. Must be disabled for private repositories. Defaults to "true".'
    required: false
    default: 'true'
  slack-webhook-url:
    description: 'Slack Webhook URL'
    required: false
  icon-url:
    description: 'Url to the avatar used for the bot in Slack'
    required: false
    default: 'https://raw.githubusercontent.com/MetaMask/action-npm-publish/main/robo.png'
  username:
    description: 'The name of the bot as it appears on Slack'
    required: false
    default: 'MetaMask bot'
  subteam:
    description: 'Use this if you want to ping a subteam of individuals on Slack using @'
    required: false
  channel:
    description: 'The Slack channel to post in'
    required: false
  dry-run:
    description: 'Whether to do a dry run, which prepares the packages for publishing but does not publish them. Must be "true" or "false".'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Sanitize Yarn configuration
      shell: bash
      run: ${{ github.action_path }}/scripts/sanitize.sh
      env:
        YARN_IGNORE_PATH: '1'
    - name: Run main publish script
      id: publish
      shell: bash
      run: ${{ github.action_path }}/scripts/main.sh
      env:
        YARN_IGNORE_PATH: '1'
        PUBLISH_NPM_TAG: ${{ inputs.npm-tag }}
        PROVENANCE: ${{ inputs.provenance }}
        REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Install `pkdiff`
      id: install-pkdiff
      if: inputs.dry-run == 'true'
      shell: bash
      run: npm i -g pkdiff@2.0.1
    - name: Generate package diff report
      id: generate-report
      shell: bash
      if: inputs.dry-run == 'true'
      run: ${{ github.action_path }}/scripts/report.sh
    - name: Upload package report artifact
      id: upload-artifact
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@v4
      with:
        path: |
          /tmp/*.tgz
          /tmp/*.html
    - name: Generate Slack message
      shell: bash
      if: inputs.slack-webhook-url != ''
      run: |
        mention=""
        if [[ -n "$SLACK_SUBTEAM" ]]; then
          mention="<!subteam^$SLACK_SUBTEAM> "
        fi

        release="$GITHUB_REPOSITORY"
        version=$(gh api "/repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" \
          --header "Accept: application/vnd.github.raw+json" \
          --jq '.version // empty' 2>/dev/null) || version=""
        if [[ -n "$version" ]]; then
          release="$GITHUB_REPOSITORY@$version"
        fi

        jq --null-input \
          --arg release "$release" \
          --arg mention "$mention" \
          --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/" \
          --arg instructions_url "https://www.notion.so/metamask-consensys/NPM-publishing-with-OIDC-374f86d67d68805583e9f824ff5ff18e#374f86d67d68807da68cf75485fd70d2" \
          --arg icon_url "$SLACK_ICON_URL" \
          --arg username "$SLACK_USERNAME" \
          --arg channel "$SLACK_CHANNEL" \
          '
          {
              text: ":rocket: A new release of `\($release)` is awaiting deployment.",
              icon_url: $icon_url,
              username: $username,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":rocket: A new release of `\($release)` *is awaiting deployment.*"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "\($mention)This release needs approval on *GitHub*, and then on *npm* before it is published."
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":hourglass_flowing_sand: npm runs an automated review first, so the npm approval may not be available right away."
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "1. Approve on GitHub" },
                      style: "primary",
                      url: $run_url
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "2. Approve on npm" },
                      url: "https://www.npmjs.com/"
                    }
                  ]
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: "React with :eyes: when you start reviewing, and :white_check_mark: once both are approved · <\($instructions_url)|How to approve on npm>"
                    }
                  ]
                }
              ]
          }
          | if $channel != "" then .channel = "#\($channel)" else . end
          ' > "$SLACK_PAYLOAD_PATH"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SLACK_SUBTEAM: ${{ inputs.subteam }}
        SLACK_ICON_URL: ${{ inputs.icon-url }}
        SLACK_USERNAME: ${{ inputs.username }}
        SLACK_CHANNEL: ${{ inputs.channel }}
        SLACK_PAYLOAD_PATH: ${{ runner.temp }}/slack-payload.json
    - name: Post to Slack
      if: inputs.slack-webhook-url != ''
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ runner.temp }}/slack-payload.json
      continue-on-error: true
