name: 'Publish to npm'
description: 'Publish the release to npm'
inputs:
  npm-tag:
    description: 'The npm tag to publish to. Defaults to "latest".'
    required: false
    default: 'latest'
  staged-publish:
    description: 'Whether to use staged publishing. Defaults to "true". If set to "false", the action will publish directly to NPM without a staging step.'
    required: false
    default: 'true'
  provenance:
    description: 'Whether to include provenance information in the package. Must be disabled for private repositories. Defaults to "true".'
    required: false
    default: 'true'
  slack-webhook-url:
    description: 'Slack Webhook URL'
    required: false
  icon-url:
    description: 'Url to the avatar used for the bot in Slack'
    required: false
    default: 'https://raw.githubusercontent.com/MetaMask/action-npm-publish/main/robo.png'
  username:
    description: 'The name of the bot as it appears on Slack'
    required: false
    default: 'MetaMask bot'
  subteam:
    description: 'Use this if you want to ping a subteam of individuals on Slack using @'
    required: false
  channel:
    description: 'The Slack channel to post in'
    required: false
  dry-run:
    description: 'Whether to do a dry run, which prepares the packages for publishing but does not publish them. Must be "true" or "false".'
    required: true
  use-pack:
    description: 'Whether to publish the tarballs packed by the `pack` action in an earlier job, instead of packing the packages in the checkout. When "true", the action downloads the artifact, and neither a checkout nor Yarn is needed. Defaults to "false".'
    required: false
    default: 'false'
  artifact-name:
    description: 'The name of the artifact that contains the tarballs packed by the `pack` action. Only used if `use-pack` is "true". Defaults to "npm-tarballs".'
    required: false
    default: 'npm-tarballs'

runs:
  using: 'composite'
  steps:
    - name: Sanitize Yarn configuration
      if: inputs.use-pack != 'true'
      shell: bash
      run: ${{ github.action_path }}/scripts/sanitize.sh
      env:
        YARN_IGNORE_PATH: '1'
    - name: Download packed tarballs
      if: inputs.use-pack == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/npm-tarballs
    - name: Run main publish script
      id: publish
      shell: bash
      run: ${{ github.action_path }}/scripts/main.sh
      env:
        YARN_IGNORE_PATH: '1'
        USE_PACK: ${{ inputs.use-pack }}
        TARBALLS_DIRECTORY: ${{ runner.temp }}/npm-tarballs
        PUBLISH_NPM_TAG: ${{ inputs.npm-tag }}
        STAGED_PUBLISH: ${{ inputs.staged-publish }}
        PROVENANCE: ${{ inputs.provenance }}
        REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Install `pkdiff`
      id: install-pkdiff
      if: inputs.dry-run == 'true'
      shell: bash
      run: npm i -g pkdiff@2.0.1
    - name: Generate package diff report
      id: generate-report
      shell: bash
      if: inputs.dry-run == 'true'
      run: ${{ github.action_path }}/scripts/report.sh
      env:
        TARBALLS_DIRECTORY: ${{ inputs.use-pack == 'true' && format('{0}/npm-tarballs', runner.temp) || '/tmp' }}
    - name: Upload package report artifact
      id: upload-artifact
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@v4
      with:
        path: |
          ${{ inputs.use-pack == 'true' && format('{0}/npm-tarballs', runner.temp) || '/tmp' }}/*.tgz
          ${{ inputs.use-pack == 'true' && format('{0}/npm-tarballs', runner.temp) || '/tmp' }}/*.html
    - name: Link package report in the job summary
      if: inputs.dry-run == 'true'
      shell: bash
      env:
        ARTIFACT_URL: ${{ steps.upload-artifact.outputs.artifact-url }}
      run: |
        {
          echo "### Package diffs"
          echo
          echo "View the complete diff between each package and its latest published version in the report: ${ARTIFACT_URL}"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Generate Slack publish message (1/2)
      id: name-version
      shell: bash
      if: inputs.slack-webhook-url != ''
      env:
        USE_PACK: ${{ inputs.use-pack }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Without a checkout, the root `package.json` is read with the GitHub
        # API, at the commit that is being released.
        if [[ "$USE_PACK" == "true" ]]; then
          MANIFEST=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" --jq '.content' | base64 --decode)
        else
          MANIFEST=$(cat package.json)
        fi

        NAME_VERSION_TEXT=$(jq --raw-output '.name + "@" + .version' <<< "$MANIFEST")
        NAME_VERSION_TEXT_STRIPPED="${NAME_VERSION_TEXT#@}"
        echo "NAME_VERSION=$NAME_VERSION_TEXT_STRIPPED" >> "$GITHUB_OUTPUT"
    - name: Generate Slack publish message (2/2)
      id: final-text
      shell: bash
      if: inputs.slack-webhook-url != ''
      env:
        NAME_VERSION: ${{ steps.name-version.outputs.NAME_VERSION }}
        SUBTEAM_TEXT: ${{ inputs.subteam }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        JOB_ID: ${{ job.check_run_id }}
        USE_PACK: ${{ inputs.use-pack }}
      run: |
        # The release details and the files in each package are in the summary of
        # this job, which is shown on the page of the run.
        RUN_URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID/"
        if [[ "$USE_PACK" == "true" ]]; then
          RUN_URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID#summary-$JOB_ID"
        fi

        DEFAULT_TEXT="\`$NAME_VERSION\` is awaiting deployment :rocket: \n <$RUN_URL|→ Click here to review deployment> \n <https://www.notion.so/metamask-consensys/NPM-publishing-with-OIDC-374f86d67d68805583e9f824ff5ff18e#374f86d67d68807da68cf75485fd70d2|→ See instructions for approving staged packages here>"
        FINAL_TEXT="$DEFAULT_TEXT"
        if [[ ! "$SUBTEAM_TEXT" == "" ]]; then
          FINAL_TEXT="<!subteam^$SUBTEAM_TEXT> $DEFAULT_TEXT"
        fi
        echo "FINAL_TEXT=$FINAL_TEXT" >> "$GITHUB_OUTPUT"
    - name: Post to a Slack channel
      if: ${{ inputs.slack-webhook-url != '' && inputs.channel != '' }}
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ steps.final-text.outputs.FINAL_TEXT }}",
            "icon_url": "${{ inputs.icon-url }}",
            "username": "${{ inputs.username }}",
            "channel": "#${{ inputs.channel }}"
          }
      continue-on-error: true
    - name: Post to a default Slack channel
      if: ${{ inputs.slack-webhook-url != '' && inputs.channel == '' }}
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ steps.final-text.outputs.FINAL_TEXT }}",
            "icon_url": "${{ inputs.icon-url }}",
            "username": "${{ inputs.username }}"
          }
      continue-on-error: true
